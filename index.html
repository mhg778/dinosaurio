<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>DINOSAURIO 2.02</title>
    <style>
        /* CSS: Estilos base, layout y reglas @media print */

        * { box-sizing: border-box; }
        html { color-scheme: dark; scroll-behavior: smooth; }
        body { margin: 0; background: #0b1119; color: #e4edf7; font: 15px/1.5 Arial, sans-serif; }
        :root { --bg: #0b1119; --panel: #121d29; --panel-2: #182735; --border: #304255; --muted: #adc0d4; --dim: #9bb0c5; --text: #e4edf7; --cyan: #54c8ff; --lime: #b6df72; --amber: #f2c36b; --danger: #ff8d91; --khaki: #e4edf7; --accent: #54c8ff; --accent-2: #f2c36b; --olive: #284657; --olive-light: #b6df72; --radius: 12px; --radius-sm: 6px; }
        [hidden], .hidden, .print-only { display: none !important; }
        a { color: var(--cyan); cursor: pointer; }
        button, input, select { font: inherit; }
        button, select, input[type=number] { border: 1px solid var(--border); border-radius: 7px; background: #192c3d; color: var(--text); padding: 8px 10px; }
        button { cursor: pointer; min-height: 36px; }
        button:hover { background: #243f53; border-color: var(--cyan); }
        button:disabled { opacity: .5; cursor: not-allowed; }
        button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
        .primary, .btn-action-primary { background: #225473; border-color: var(--cyan); }
        input[type=checkbox] { accent-color: var(--cyan); width: 17px; height: 17px; }
        input[type=range] { width: 100%; accent-color: var(--cyan); min-height: 28px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
        th { font-weight: 700; color: var(--muted); }
        .num, .big-number, input[type=number] { font-variant-numeric: tabular-nums; }
        .num { text-align: right; }
        h1, h2, h3 { line-height: 1.25; margin: 0 0 10px; }
        h1 { font-size: 26px; letter-spacing: .08em; }
        h2 { font-size: 18px; }
        h3 { font-size: 16px; }
        p { margin: 6px 0 12px; }
        .wrap, .masthead-inner { max-width: 1420px; margin: auto; padding: 0 24px; }
        header.masthead { padding: 18px 0; border-bottom: 1px solid var(--border); background: #101b26; }
        .masthead-inner { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        .rex-badge { font-size: 29px; }
        .masthead-text { flex: 1; min-width: 0; }
        .masthead-text>p { color: var(--muted); margin: 5px 0; }
        .cat-selector, .nav-tabs-bar, .snap-actions, .recipe-actions-row, .mc-export-row, .rot3d-controls, .mode-switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .cat-btn { padding: 7px 12px; }
        .cat-btn.sel, .nav-tab-btn.active, .journey-btn.active, .mode-btn.sel, .rot3d-btn.active { background: #24475f; border-color: var(--cyan); color: #fff; }
        .nav-tabs-bar { padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
        .nav-tab-btn { white-space: nowrap; }
        .evidence-bar { color: var(--muted); font-size: 12px; padding: 12px 0; }
        .ev-badge, .pill, .status-pill, .lever-beta-badge, .badge-code, .dino-tag, .badge-ejercito, .delta-tag { display: inline-block; border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; font-size: 12px; }
        .ev-obs, .fixed { color: var(--lime); }
        .ev-est, .ev-rec, .modified { color: var(--amber); }
        .error, .danger, .infeasible { color: var(--danger); }
        .minor, .sub, .mc-foot, .chart-foot, .sens-sub, .delta-note, .limit-note { color: var(--muted); font-size: 13px; }

        .lab-context-bar, .lab-case-toolbar, .evidence-status-bar, .recipe-status-header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; margin: 10px 0; }
        .lab-journey-switcher, .lab-journey-grid, .journey-switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .journey-btn { display: block; text-align: left; padding: 14px; flex: 1; }

        .journey-btn small { color: var(--muted); }
        .lab-workspace-grid { display: grid; grid-template-columns: minmax(330px, .85fr) minmax(430px, 1.15fr); gap: 22px; align-items: start; margin-top: 16px; }
        .lab-workspace-grid>div:nth-child(2) { position: sticky; top: 12px; }
        .card, .evidence-card, .mc-card, .policy-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; min-width: 0; }
        .policy-panel { border-color: #497891; }
        .policy-field { display: block; margin: 14px 0; }
        .policy-field strong { float: right; color: var(--cyan); }
        .policy-field input { display: block; margin-top: 6px; }
        .lever-group-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }
        .lever-item-card { border: 1px solid var(--border); border-radius: 9px; background: #152332; padding: 12px; margin-bottom: 10px; }
        .lever-item-card.modified { border-color: #548093; }
        .l-top, .l-tit, .l-met, .l-ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .l-top { justify-content: space-between; margin-bottom: 6px; }
        .lever-name { font-weight: 700; font-size: 14px; }
        .l-met { font-size: 12px; color: var(--muted); }
        .lever-val-scen { color: var(--cyan); font-weight: 700; }
        .l-wrap { flex: 1; min-width: 120px; }
        .lever-num-input { width: 76px; padding: 6px !important; }
        .btn-lever-reset { padding: 6px 9px; }
        .descriptive, .merit-detail, details { border: 1px solid var(--border); border-radius: 9px; padding: 10px; margin-bottom: 12px; }
        summary { cursor: pointer; font-weight: 700; color: var(--muted); }
        details[open]>summary { margin-bottom: 12px; }
        .triple-display-grid, .mc-kpi-grid, .delta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
        .display-box, .mc-kpi, .delta-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
        .display-label, .kl, .di-label { font-size: 12px; color: var(--muted); }
        .big-number { font-size: 32px; line-height: 1.3; font-weight: 700; white-space: nowrap; }
        .cyan, .kv, .di-val { color: var(--cyan); }
        .dim { color: var(--muted); }
        .lime { color: var(--lime); }
        .amber { color: var(--amber); }
        canvas { display: block; width: 100%; height: auto; max-width: 100%; }
        .chart-overlay { font-size: 12px; border: 1px solid var(--border); padding: 8px; margin-bottom: 8px; }
        .ov-row, .ss-row { display: flex; justify-content: space-between; gap: 10px; }
        .hyp-only { display: none; }
        .hyp-active .hyp-only { display: flex; }
        .snap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
        .snap-col { padding: 12px; border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
        .snap-title { font-weight: 700; }
        .snap-empty { font-size: 13px; color: var(--muted); padding: 12px 0; }
        .snap-stats { font-size: 12px; }
        .snap-actions { margin-top: 10px; }
        .mc-controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; padding: 14px; background: var(--panel-2); border-radius: 8px; }
        .mc-ctrl { flex: 1; min-width: 160px; }
        .mc-ctrl label { display: block; color: var(--muted); font-size: 13px; }
        .mc-snap-checks { min-width: 160px; }
        .mc-snap-check { display: flex; align-items: center; gap: 6px; }
        .mc-run-btn { background: #225473; min-height: 42px; }
        .mc-kpi-grid { grid-template-columns: repeat(4, 1fr); }
        .kv { font-size: 22px; font-weight: 700; }
        .mc-chart-box { padding: 14px; border: 1px solid var(--border); border-radius: 9px; margin: 14px 0; display: none; }
        .mc-card.has-results .mc-chart-box { display: block; }
        .empty-state { text-align: center; padding: 28px; background: #152332; border: 1px dashed #4a687f; border-radius: 9px; margin: 14px 0; }
        .mc-legend, .legend-inline, .mc-multi-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 8px 0; }
        .mc-export-row { margin-top: 12px; }
        .mc-status { padding: 8px 0; color: var(--cyan); }
        .mc-spectral-box { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
        .mc-spectral-box canvas { max-height: 65vh; object-fit: contain; }
        .cap-note { display: none; padding: 10px; border: 1px solid #977747; background: #302b21; color: #f4d9a6; font-size: 13px; margin-top: 8px; }
        .cap-note.show { display: block; }
        .chart-box, .bayes-note, .restrict-box, .target-setting-box { background: var(--panel-2); padding: 12px; border-radius: 8px; margin: 10px 0; }
        .recipe-table { margin: 12px 0; }
        .recipe-actions-row { margin-top: 12px; }
        .doc-dialog { max-width: 1000px; width: 90vw; max-height: 88vh; background: var(--panel); color: var(--text); border: 1px solid #54748e; border-radius: 12px; padding: 0; }
        .doc-dialog::backdrop { background: #000b; }
        .doc-dialog-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
        .doc-dialog-tabs { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; }
        .doc-dialog-body { padding: 18px; overflow: auto; }
        .doc-tab-btn.active { border-color: var(--cyan); }
        .doc-section h4 { color: var(--cyan); margin: 16px 0 6px; }
        .doc-table { font-size: 13px; }
        .disclaimer-compact-card { font-size: 13px; color: var(--muted); padding: 14px; border-top: 1px solid var(--border); }
        footer { padding: 18px 24px; text-align: center; color: var(--muted); font-size: 13px; }
        .pag-btn { padding: 5px 9px; }
        .catalog-table-wrap { overflow: auto; }
        .alt-card { border: 1px solid var(--border); padding: 14px; border-radius: 8px; }
        .restriction-note { color: var(--amber); }
        #chartAgeEffect { margin: 12px 0; }
        #printReport { display: none; }

        @media(max-width:960px) {
            .lab-workspace-grid { grid-template-columns: 1fr; }
            .lab-workspace-grid>div:nth-child(2) { position: static; }
            .wrap, .masthead-inner { padding: 0 14px; }
            .big-number { font-size: 27px; }
        }

        @media(max-width:620px) {
            .triple-display-grid, .snap-grid, .mc-kpi-grid { grid-template-columns: 1fr 1fr; }
            .display-box:last-child { grid-column: 1/-1; }
            .lab-journey-switcher, .journey-switcher { display: flex; flex-wrap: wrap; }
            .journey-btn { min-width: 220px; }
            .big-number { font-size: 26px; }
            .l-met { width: 100%; }
            .mc-ctrl { min-width: 140px; }
            .nav-tab-btn { font-size: 13px; }
            .doc-dialog { width: 96vw; }
            h1 { font-size: 23px; }
        }

        @media print {
            body>*:not(#printReport) { display: none !important; }
            #printReport { display: block !important; background: white; color: black; padding: 12px; font: 14px Arial; }
            #printReport table { border-collapse: collapse; }
            #printReport td, #printReport th { border: 1px solid #aaa; padding: 6px; }
            #printReport img { max-width: 100%; }
        }

        .cat-selector .btn-doc-header { margin-left: auto; background: #101b26; border-color: #497891; color: var(--cyan); }
        .journey-selector-card { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
        .journey-btn { min-width: 0; padding: 14px 16px; text-align: left; background: #101b26; border-radius: 10px; }
        .journey-btn strong { display: block; font-size: 16px; margin: 3px 0; }
        .journey-btn small { font-size: 12px; }
        .journey-btn.active { box-shadow: inset 3px 0 0 var(--cyan); }
        .nav-tabs-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: #101b26; border: 1px solid var(--border); border-radius: 10px; }
        .nav-tab-btn { background: transparent; border-color: transparent; color: var(--muted); padding: 7px 10px; min-height: 34px; }
        .nav-tab-btn:hover { background: #1b3143; color: #fff; }
        .nav-tab-btn.active { box-shadow: inset 0 -2px var(--cyan); }
        .lab-context-bar, .lever-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .lab-context-bar { padding: 10px 12px; background: #101b26; border: 1px solid var(--border); border-radius: 10px; }
        .context-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .l-top { display: flex; justify-content: space-between; gap: 8px; }
        .l-met { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
        .l-ctrl { display: grid; grid-template-columns: minmax(0, 1fr) 64px 32px; gap: 8px; align-items: center; margin-top: 7px; }
        .lever-num-input { width: 64px !important; min-height: 32px !important; }
        .lever-group-title { display: flex; gap: 8px; align-items: center; padding: 12px 0 6px; border-top: 1px solid rgba(255, 255, 255, .08); }
        .lever-group-title .f-right { margin-left: auto; }
        details.descriptive, details.fold-panel { margin-top: 12px; background: #101b26; border: 1px solid #497891; border-radius: 9px; padding: 0; }
        details.descriptive summary, details.fold-panel summary { padding: 11px 12px; cursor: pointer; color: var(--cyan); font-weight: 700; font-size: 13px; list-style: none; }
        details.descriptive summary:before, details.fold-panel summary:before { content: '▸'; margin-right: 7px; display: inline-block; }
        details.descriptive[open] summary:before, details.fold-panel[open] summary:before { transform: rotate(90deg); }
        details.descriptive[open], details.fold-panel[open] { background: #142331; }
        .snap-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .snap-col { border: 1px solid var(--border); border-radius: 9px; padding: 10px; background: #101b26; min-width: 0; }
        .snap-title { font-size: 13px; font-weight: 700; }
        .snap-empty { padding: 18px 4px; color: var(--muted); font-size: 12px; }
        .ss-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid rgba(255, 255, 255, .06); font-size: 12px; }
        .delta-per-block, .sens-per-block { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .dpb-row, .spb-row { display: flex; justify-content: space-between; gap: 6px; padding: 6px; background: #101b26; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
        .mc-card { padding: 16px; }
        .mc-controls { display: grid; grid-template-columns: minmax(220px, 1.2fr) repeat(3, minmax(150px, 1fr)) auto; gap: 12px; align-items: end; padding: 12px; background: #101b26; border: 1px solid var(--border); border-radius: 10px; }
        .mc-ctrl label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }

        .mc-run-btn { min-height: 40px; white-space: nowrap; background: #225473; border-color: var(--cyan); color: #fff; }

        .mc-chart-box { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #101b26; }

    function lineChart(series, bands, years, w, h) {
        var padL = 46, padR = 14, padT = 22, padB = 30, all = [], i;
        series.forEach(function (z) { z.v.forEach(function (x) { if (Number.isFinite(x)) all.push(x); }); });
        bands.forEach(function (b) { b.lo.concat(b.hi).forEach(function (x) { if (Number.isFinite(x)) all.push(x); }); });
        var lo = Math.floor((Math.min.apply(null, all) - 0.2) * 2) / 2, hi = Math.ceil((Math.max.apply(null, all) + 0.2) * 2) / 2;
        if (hi - lo < 0.5) hi = lo + 0.5;
        function X(k) { return padL + (w - padL - padR) * k / (years.length - 1); }
        function Y(x) { return padT + (h - padT - padB) * (1 - (x - lo) / (hi - lo)); }
        var o = '<svg class="m2-chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Edad de la fuerza activa por año: medias con y sin reforma y bandas de percentiles">';
        for (i = 0; i <= 4; i++) { var yv = lo + (hi - lo) * i / 4; o += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + Y(yv).toFixed(1) + '" y2="' + Y(yv).toFixed(1) + '" class="m2-grid-l"/><text x="' + (padL - 6) + '" y="' + (Y(yv) + 4).toFixed(1) + '" text-anchor="end" class="m2-axis">' + fmt(yv, 1) + '</text>'; }
        years.forEach(function (yr, k) { if (k % 2 === 0 || years.length < 9) o += '<text x="' + X(k).toFixed(1) + '" y="' + (h - 10) + '" text-anchor="middle" class="m2-axis">' + yr + '</text>'; });
        bands.forEach(function (b) {
            var up = b.hi.map(function (x, k) { return X(k).toFixed(1) + ',' + Y(x).toFixed(1); }), dn = b.lo.map(function (x, k) { return X(k).toFixed(1) + ',' + Y(x).toFixed(1); }).reverse();
            o += '<polygon class="m2-band" points="' + up.concat(dn).join(' ') + '" fill="' + b.color + '" fill-opacity="' + b.op + '"><title>' + b.name + '</title></polygon>';
        });
        series.forEach(function (z) {
            var pts = z.v.map(function (x, k) { return X(k).toFixed(1) + ',' + Y(x).toFixed(1); }).join(' ');
            o += '<polyline fill="none" stroke="' + z.color + '" stroke-width="2.4" points="' + pts + '"' + (z.dash ? ' stroke-dasharray="6 4"' : '') + '/>';
        });
        var lx = padL + 8; series.concat(bands.map(function (b) { return { name: b.name, color: b.color, band: true }; })).forEach(function (z) {
            o += z.band ? '<rect x="' + lx + '" y="' + (padT - 12) + '" width="22" height="9" fill="' + z.color + '" fill-opacity="0.45"/>' : '<line x1="' + lx + '" x2="' + (lx + 22) + '" y1="' + (padT - 7) + '" y2="' + (padT - 7) + '" stroke="' + z.color + '" stroke-width="2.4"' + (z.dash ? ' stroke-dasharray="6 4"' : '') + '/>';
            o += '<text x="' + (lx + 27) + '" y="' + (padT - 3) + '" class="m2-axis">' + z.name + '</text>'; lx += 168;
        });
        return o + '</svg>';
    }

            return { ok: rt.filas.length === 10 && rt.maxDevET <= 8 && Math.abs(rt.filas[0].desviacion) < 1e-6 && !!v7 && v7.estado === 'ok' && Math.abs(P.h - 0.07) < 1e-12, detail: 'desviación máx ' + rt.maxDevET.toFixed(2) + ' % · RMSE ' + rt.rmseET.toFixed(2) + ' % · h = ' + P.h };
        }));
        out.push(T('T33', 'C1 · política en valores reales: máximo con cotas → 15 / 1,5 / 0 (todas saturadas) en Ejércitos; Comunes con factor bloqueado → factor académico fijo; los valores aplicables caen en la rejilla del Laboratorio', function () {
            var Dl = M.DUAL, E = W.DINO_ENGINE, c = E.getPolicyVector('oficiales'), r = Dl.solveDualUnits(c, Dl.LO, Dl.HI, -1, 'caja', 0, 'normalizadas'), pr = Dl.politicaReal(r, c, Dl.LO, Dl.HI, Dl.REF, Dl.GRID);
            var ok = pr.valores[0] === 15 && Math.abs(pr.valores[1] - 1.5) < 1e-9 && Math.abs(pr.valores[2]) < 1e-9 && pr.saturadas.every(Boolean);
            var q = Dl.solveDualUnits(E.getPolicyVector('oficiales'), Dl.LO, Dl.HI, -1, 'L2', 1, 'normalizadas'), pq = Dl.politicaReal(q, c, Dl.LO, Dl.HI, Dl.REF, Dl.GRID);
            pq.redondeados.forEach(function (v, i) { var g = Dl.GRID[i]; if (Math.abs(v / g - Math.round(v / g)) > 1e-6) ok = false; });
            var cc = E.getPolicyVector('comunes'), lo = Dl.LO.slice(), hi = Dl.HI.slice(); lo[1] = 0; hi[1] = 0; var rc = Dl.solveDualUnits(cc, lo, hi, -1, 'caja', 0, 'normalizadas'), pc = Dl.politicaReal(rc, cc, lo, hi, Dl.REF, Dl.GRID);
            if (!(pc.fijas[1] && !pc.saturadas[1] && Math.abs(pc.valores[1] - 1) < 1e-9)) ok = false;
            return { ok: ok, detail: 'Ejércitos ' + pr.valores.join('/') + ' · L2 ' + pq.redondeados.map(function (x) { return +x.toFixed(1); }).join('/') + ' · Comunes bloqueado Δ ' + rc.delta.toFixed(4) };
        }));
        out.push(T('T34', 'Interfaz · «Aplicar al Laboratorio» mueve los deslizadores reales y el Δ resultante coincide con policyDelta; el Laboratorio se restaura sin residuos', function () {
            var E = W.DINO_ENGINE, S = W.DINO_LAB_STATE, a0 = E.getCaseState().activeAge, ref = S.refPolicies.slice();
            var d = W.DINO_DUAL_APPLY([15, 1.5, 0]), pol = E.readPolicies(), esperado = E.policyDelta(pol, E.getCurrentCategory(), ref);
            var okAplica = JSON.stringify(pol) === JSON.stringify([15, 1.5, 0]) && Math.abs(d - esperado) < 1e-9 && d < -0.6;
            var d2 = W.DINO_DUAL_APPLY(ref), okRest = Math.abs(d2) < 1e-9 && Math.abs(E.getCaseState().activeAge - a0) < 1e-9;
            return { ok: okAplica && okRest, detail: 'Δ aplicado ' + d.toFixed(4) + ' · restaurado ' + d2.toExponential(1) };
        }));
        out.push(T('T35', 'Interfaz · Modo 2 con bandas de percentiles, columnas de mediana y P10-P90, retrospectiva de 10 filas, 7 validaciones y Δ por grupo; el dual muestra valores reales y el botón de aplicar', function () {
            W.DINO_MC_SET_MODE(2);
            var bandas = D.querySelectorAll('#m2-out polygon.m2-band').length, heads = Array.prototype.map.call(D.querySelectorAll('#m2-out thead th'), function (x) { return x.textContent; }).join('|');
            var retro = D.querySelectorAll('#m2-retro tbody tr').length, val = D.querySelectorAll('#m2-val li').length, dcc = !!D.getElementById('m2-deltacc'), lab = D.getElementById('m2-preset').options[1].textContent;
            W.DINO_MC_SET_MODE(1);
            var dual = D.getElementById('dualCard'), filas = D.querySelectorAll('#dual-out tbody tr').length, btn = !!D.getElementById('dual-apply');
            return { ok: bandas >= 2 && /Mediana/.test(heads) && /P10/.test(heads) && retro === 10 && val === 7 && dcc && /Comunes/.test(lab) && !!dual && filas === 3 && btn, detail: 'bandas ' + bandas + ' · retro ' + retro + ' · validaciones ' + val + ' · dual filas ' + filas };
        }));
        out.push(T('T36', 'Modo 2 · Δ por grupo: con Δ distinto en Comunes solo cambia la rama de Comunes; con Δ de Ejércitos = 0 y Comunes ≠ 0 la reforma afecta solo a Comunes; con ambos Δ = 0 no hay reforma', function () {
            var P = P0(); P.delta = -0.7; P.deltaCC = -1.7; var R = M.run(P), Q = P0(); Q.delta = -0.7; Q.deltaCC = -0.7; var R2 = M.run(Q), t = 6;
            var cc1 = R.base.porEj.CC[t].edadMedia - R.reforma.porEj.CC[t].edadMedia, cc2 = R2.base.porEj.CC[t].edadMedia - R2.reforma.porEj.CC[t].edadMedia;
            var et1 = R.reforma.porEj.ET[t].edadMedia, et2 = R2.reforma.porEj.ET[t].edadMedia;
            var Z = P0(); Z.delta = 0; Z.deltaCC = -1.7; var R3 = M.run(Z), soloCC = (R3.base.porEj.CC[t].edadMedia - R3.reforma.porEj.CC[t].edadMedia > 0.05) && Math.abs(R3.base.porEj.ET[t].edadMedia - R3.reforma.porEj.ET[t].edadMedia) < 1e-12;
            var N = P0(); N.delta = 0; N.deltaCC = 0; var R4 = M.run(N), sinRef = Math.abs(R4.base.total[t].edadMedia - R4.reforma.total[t].edadMedia);
            return { ok: cc1 > cc2 + 0.05 && Math.abs(et1 - et2) < 1e-12 && soloCC && sinRef < 1e-12 && R.deltaPonderado < -0.7 && R.deltaPonderado > -1.7, detail: 'rejuvenecimiento Comunes ' + cc1.toFixed(3) + ' frente a ' + cc2.toFixed(3) + ' · Δ ponderado ' + R.deltaPonderado.toFixed(3) };
        }));
        return out;
    }
    W.runDinoMathAuditTests = function () {
        var base = orig.apply(this, arguments), extra = runExtra(), results = (base.results || []).concat(extra), passed = results.filter(function (r) { return r.passed; }).length;
        try { console.table(extra); } catch (e) { }
        return { total: results.length, passed: passed, failed: results.length - passed, results: results };
    };
})();
